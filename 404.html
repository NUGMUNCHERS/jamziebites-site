<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in Space · JamzieBites</title>
  <meta name="robots" content="noindex, noai, noimageai">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Gochi+Hand&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("jb-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <main class="lost">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div>
      <img src="/assets/logo.svg" alt="" width="90" height="90" style="margin:0 auto 10px;animation:bob 4s ease-in-out infinite">
      <h1 class="grad-text">404</h1>
      <h2 style="font-size:clamp(1.5rem,4vw,2.2rem)">This page floated off into space ✦</h2>
      <p>Whatever you were looking for isn't here — but there's plenty of soft, sparkly art back home.</p>
      <a class="btn btn-primary" href="/">Take me home ♡</a>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/main.js"></script>
</body>
</html>
