<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1000px; height: 1000px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 38%),
      radial-gradient(circle at 78% 85%, rgba(97,93,220,.35) 0, rgba(97,93,220,0) 45%),
      linear-gradient(135deg, #ff8fc4 0%, #b892ff 52%, #8c8ff2 100%);
    position: relative;
  }
  .glow {
    position: absolute; left: 50%; top: 52%; width: 640px; height: 640px;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.75) 0, rgba(255,240,250,.35) 45%, rgba(255,255,255,0) 70%);
  }
  .berry { position: absolute; left: 50%; top: 52%; width: 560px; height: 560px; transform: translate(-50%, -50%);
           filter: drop-shadow(0 22px 30px rgba(120, 40, 110, .35)); }
  .spark { position: absolute; }
</style></head>
<body>
  <div class="glow"></div>
  <!-- the site's strawberry logo, minus its corner star (sparkles are drawn separately) -->
  <svg class="berry" xmlns="http://www.w3.org/2000/svg" viewBox="6 12 52 50">
    <defs>
      <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff8fc4"/>
        <stop offset="1" stop-color="#ec4f95"/>
      </linearGradient>
    </defs>
    <path d="M32 60C18 53 8 40 8 28c0-8 8-13 24-13s24 5 24 13c0 12-10 25-24 32z" fill="url(#b)" stroke="#fff" stroke-width="1.4"/>
    <path d="M32 60C18 53 8 40 8 28c0-3 1-5 3-7-1 13 7 26 21 35z" fill="#d63d84" opacity=".35"/>
    <g fill="#fff3c4">
      <ellipse cx="20" cy="29" rx="1.6" ry="2.4" transform="rotate(-15 20 29)"/>
      <ellipse cx="30" cy="27" rx="1.6" ry="2.4"/>
      <ellipse cx="42" cy="28" rx="1.6" ry="2.4" transform="rotate(15 42 28)"/>
      <ellipse cx="25" cy="38" rx="1.6" ry="2.4" transform="rotate(-10 25 38)"/>
      <ellipse cx="37" cy="37" rx="1.6" ry="2.4" transform="rotate(10 37 37)"/>
      <ellipse cx="31" cy="47" rx="1.6" ry="2.4"/>
      <ellipse cx="45" cy="38" rx="1.4" ry="2.2" transform="rotate(20 45 38)"/>
    </g>
    <path d="M32 18c-4-6-12-7-16-4 5 0 9 2 12 6-6-2-12 0-14 4 6-2 12-2 18 0 6-2 12-2 18 0-2-4-8-6-14-4 3-4 7-6 12-6-4-3-12-2-16 4z" fill="#7fd6a0" stroke="#fff" stroke-width="1"/>
    <ellipse cx="22" cy="22" rx="4" ry="2.4" fill="#fff" opacity=".45" transform="rotate(-25 22 22)"/>
  </svg>
  <!-- sparkles, kept inside the circle Gmail crops to -->
  <svg class="spark" style="left:690px;top:215px;width:120px;height:120px" viewBox="0 0 24 24"><path d="M12 1l2.9 6.6 7.1.8-5.3 4.8 1.5 7.1L12 16.7 5.8 20.3l1.5-7.1L2 8.4l7.1-.8z" fill="#ffcf4d" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <svg class="spark" style="left:205px;top:300px;width:64px;height:64px" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z" fill="#fff"/></svg>
  <svg class="spark" style="left:760px;top:640px;width:50px;height:50px" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z" fill="#fff" opacity=".9"/></svg>
  <svg class="spark" style="left:250px;top:690px;width:38px;height:38px" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z" fill="#fff3c4"/></svg>
</body></html>
